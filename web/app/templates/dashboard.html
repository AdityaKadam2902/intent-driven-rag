{% extends "base.html" %}
{% block title %}Dashboard — Meldep AgentPod{% endblock %}
{% block content %}
<h3 class="mb-4">Assistants</h3>
<div class="row g-3">
  {% for assistant in assistants %}
  <div class="col-md-4">
    <div class="card h-100 shadow-sm">
      <div class="card-body d-flex flex-column">
        <h5 class="card-title"><i class="bi bi-chat-dots"></i> {{ assistant.name }}</h5>
        <p class="card-text text-muted flex-grow-1">{{ assistant.description }}</p>
        <div class="d-flex gap-2">
          <a href="/chat/{{ assistant.id }}" class="btn btn-primary btn-sm">
            <i class="bi bi-chat"></i> Chat
          </a>
          <a href="/documents/{{ assistant.id }}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-folder"></i> Documents
          </a>
        </div>
      </div>
    </div>
  </div>
  {% endfor %}

  <div class="col-md-4">
    <div class="card h-100 border-dashed text-center text-muted d-flex align-items-center justify-content-center" style="border-style: dashed;">
      <div class="card-body">
        <i class="bi bi-plus-circle fs-3"></i>
        <p class="mb-0 mt-2 small">More assistants coming soon</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
